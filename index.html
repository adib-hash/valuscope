<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080A10" />
    <script>
      (function () {
        var t = localStorage.getItem('vs-theme');
        var dark = !t || t === 'dark';
        if (dark) document.documentElement.classList.add('dark');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#080A10' : '#F4F6FA');
      })();
    </script>
    <title>ValueScope — Historical Valuation Multiples</title>
    <meta name="description" content="Look up 5-year historical valuation multiples for any US public company. P/E, EV/EBITDA, P/FCF, and more." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="ValueScope" />
    <meta property="og:description" content="Historical valuation multiples for US public companies. P/E, EV/EBITDA, P/FCF and more, back 10-15 years." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://valuscope.ihsan.build/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
